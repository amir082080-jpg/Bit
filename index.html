<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101014">
  <title>AMIR BEAT AI</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="app">

    <header>
      <h1>🎵 AMIR BEAT AI</h1>
      <p>استودیو ساخت بیت رپ روی گوشی</p>
    </header>

    <section class="card">
      <h2>🎚️ کنترل ریتم</h2>

      <div class="bpm-row">
        <span>BPM</span>
        <strong id="bpmValue">100</strong>
      </div>

      <input id="bpm" type="range" min="60" max="180" value="100">

      <div class="buttons">
        <button id="play">▶️ شروع</button>
        <button id="stop">⏹ توقف</button>
      </div>
    </section>

    <section class="card">
      <h2>🥁 پدهای صدا</h2>

      <div class="pads">
        <button data-sound="kick">KICK</button>
        <button data-sound="snare">SNARE</button>
        <button data-sound="hihat">HI-HAT</button>
        <button data-sound="clap">CLAP</button>
      </div>
    </section>

    <section class="card">
      <h2>🤖 هوش مصنوعی</h2>

      <textarea
        id="prompt"
        placeholder="مثلاً: یک بیت دارک وست‌ساید با BPM 95 پیشنهاد بده"
      ></textarea>

      <button id="aiButton" class="main-button">
        ✨ ساخت ایده با AI
      </button>

      <div id="aiStatus" class="status"></div>

      <div id="aiResult" class="result">
        نتیجه هوش مصنوعی اینجا نمایش داده می‌شود.
      </div>
    </section>

    <section class="card">
      <h2>🔊 صدای خودت</h2>

      <input id="audioFile" type="file" accept="audio/*">

      <audio id="audioPlayer" controls></audio>
    </section>

    <footer>
      AMIR BEAT AI
    </footer>

  </main>

  <script src="script.js"></script>
</body>
</html>
